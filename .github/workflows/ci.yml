name: CI

# A pull request runs one job: the full suite once, on one Python, with the
# scanner floor installed, then the repository's own required-coverage audit.
# Each test runs once per pipeline run. The Python version matrix runs on
# release tags (release.yaml), and a merge to main runs no tests: it runs the
# self-audit that keeps code scanning current (self-audit.yml).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and scanner coverage
    runs-on: ubuntu-latest
    # A hung child process once cost 45 minutes of billed runner time before
    # anything killed it, and a required check that never reports blocks a
    # merge instead of refusing it. This bound is generous against the real
    # runtime; `test_every_child_process_is_bounded` stops the suite spawning
    # an unbounded child in the first place.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The falsifier proof below checks out the base commit beside this one.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # One source for the floor install — see ./.github/actions/install-floor.
      # The suite runs with the floor present, so an adapter test that reads
      # the real PATH behaves here as it does wherever the tools exist, and the
      # offline-ruleset tests (which need semgrep, bandit, njsscan and RuboCop)
      # run rather than skip.
      - name: Install the scanner floor
        uses: ./.github/actions/install-floor
        with:
          extras: "dev,python-scanners"

      # --user-install because the runner's system gem directory is not
      # writable, and the user gem bin has to reach PATH or the Ruby overlap
      # test finds no `rubocop` and skips, which the guard below fails on.
      - name: Install RuboCop for the Ruby overlap check
        run: |
          gem install --user-install --no-document rubocop -v 1.90.0
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      # No --cov-fail-under here: the floor is declared once, in
      # pyproject.toml, and this run reads it from there. `-rs` lists every
      # skip, so the guard below can refuse a skipped offline-ruleset test: a
      # skip nobody notices is how a ruleset rots.
      - name: Test with branch coverage
        run: >-
          python -m pytest
          -o cache_dir=.pytest-cache-ci
          --cov=secure_code_audit
          --cov-branch
          --cov-report=term-missing
          -rs 2>&1 | tee pytest-output.txt;
          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: No offline-ruleset test was skipped
        run: |
          if grep -E "^SKIPPED .*test_offline_ruleset" pytest-output.txt; then
            echo "::error::an offline-ruleset test skipped; the tool it needs is missing"
            exit 1
          fi

      # Test first, checked rather than claimed: each test this pull request
      # adds must fail against the base's code (tools/prove_falsifiers.py).
      # It runs only the added tests, against different code, so no test runs
      # twice on the same code.
      - name: Each new test fails without its change
        if: github.event_name == 'pull_request'
        run: python tools/prove_falsifiers.py --base "origin/${{ github.base_ref }}"

      - name: Build wheel through pip
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Verify the required scanner toolchain resolves
        run: secure-code-agent --config secure-code-agent.json --preflight

      # Scorecard is not here on purpose. It is in the declared floor at
      # repository cadence and runs in supply-chain.yml, because its answers
      # belong to the project rather than the change. Its coverage arrives by
      # SARIF import (D3).
      - name: Run required security coverage
        run: >-
          secure-code-agent
          --config secure-code-agent.json
          --fail-on-gate
          --output secure-code-report.md
          --json-output secure-code-report.json
          --sarif-output secure-code.sarif
          --code-scanning-sarif-output secure-code.code-scanning.sarif
          --prompt-output secure-code-remediation-prompt.md
          --comment-output secure-code-pr-comment.md

      # Uploaded even when the audit step failed: that SARIF is the one worth
      # publishing. The code-scanning file, not secure-code.sarif: code
      # scanning opens an alert for every uploaded result and ignores SARIF
      # `suppressions` (D22). Not from a fork, which has no write token.
      - name: Upload SARIF to code scanning
        if: >-
          !cancelled() &&
          hashFiles('secure-code.code-scanning.sarif') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: secure-code.code-scanning.sarif
          category: secure-code-agent-self-audit

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-code-agent-audit
          if-no-files-found: error
          path: |
            secure-code-report.md
            secure-code-report.json
            secure-code.sarif
            secure-code.code-scanning.sarif
            secure-code-remediation-prompt.md
            secure-code-pr-comment.md
