name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Read from the package, which is now the only place the version is
      # written — pyproject derives it via `[tool.setuptools.dynamic]`. This
      # step used to read pyproject's own `version =` line, so when that line
      # and the package disagreed it compared the tag against the half that was
      # right and shipped the half that was wrong: v0.4.0 went out stamping
      # 0.3.0 into every artifact it produced.
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(python -c 'import sys; sys.path.insert(0, "src"); import secure_code_audit; print(secure_code_audit.__version__)')"
          echo "tag=${GITHUB_REF_NAME} package=v${PACKAGE_VERSION}"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      # The verification step below runs this repository's own gate, and the
      # config requires `["floor"]`. Installing only `[dev,required-scanners]`
      # left checkov, osv-scanner, trivy, semgrep and gitleaks unresolved, so
      # `--preflight` exited 1 and every tagged release would have failed here.
      # The floor install lives in one place now; see the composite action.
      - name: Install the scanner floor
        uses: ./.github/actions/install-floor
        with:
          extras: "dev,python-scanners"

      - name: Install the build toolchain
        run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.1.0

      - name: Verify source before release
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest --cov=secure_code_audit --cov-branch --cov-fail-under=85
          secure-code-agent --config secure-code-agent.json --preflight
          secure-code-agent --config secure-code-agent.json --fail-on-gate --output secure-code-release-audit.md --json-output secure-code-release-audit.json

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Attest distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          if-no-files-found: error
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/secure-code-agent/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-distributions
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
