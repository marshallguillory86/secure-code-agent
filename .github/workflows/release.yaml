name: Release

# Started on main by cut-release.yml when a version bump merges, or by a v* tag
# the maintainer pushes. The build refuses a commit off main and a version
# already tagged; publishing to PyPI waits for the maintainer's approval in the
# `pypi` environment; the tag is cut only after PyPI accepts the upload, and
# the GitHub release follows the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Python version matrix runs here, once per release, rather than on
  # every pull request. 3.12 is left out because `build` runs the full suite
  # on it below; each test runs once per pipeline run.
  python-versions:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Test
        run: python -m pytest -o cache_dir=.pytest-cache-ci --no-cov -q

  build:
    needs: python-versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only a commit that reached main through its required checks is
      # released. A v* tag on any other commit stops here.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; only a commit on main is released"
            exit 1
          fi
          echo "ok    $GITHUB_SHA is on main"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Read from the package, the only place the version is written:
      # pyproject derives it. On a tag run the tag must name this version (an
      # earlier step read pyproject instead, and v0.4.0 shipped stamping
      # 0.3.0). On a run from main the version must not be tagged yet, so a
      # version already released is never built and published again.
      - name: The version is new or matches its tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/secure_code_audit/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::no __version__ literal in src/secure_code_audit/__init__.py"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not name the package version v${version}"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "::error::v${version} is already tagged; bump the version to release again"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ok    releasing v${version}"

      # The verification step below runs this repository's own gate, and the
      # config requires `["floor"]`. Installing only `[dev,required-scanners]`
      # left checkov, osv-scanner, trivy, semgrep and gitleaks unresolved, so
      # `--preflight` exited 1 and every tagged release would have failed here.
      # The floor install lives in one place now; see the composite action.
      - name: Install the scanner floor
        uses: ./.github/actions/install-floor
        with:
          extras: "dev,python-scanners"

      - name: Install the build toolchain
        run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.1.0

      - name: Verify source before release
        run: |
          python -m ruff check .
          python -m ruff format --check .
          # The floor is pyproject.toml's fail_under. A --cov-fail-under here
          # would override it, and the one that was here said 85 against a
          # declared 92 — a release could ship under the floor it claims.
          python -m pytest --cov=secure_code_audit --cov-branch
          secure-code-agent --config secure-code-agent.json --preflight
          secure-code-agent --config secure-code-agent.json --fail-on-gate --output secure-code-release-audit.md --json-output secure-code-release-audit.json

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Attest distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          if-no-files-found: error
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/secure-code-agent/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The tag is cut only after PyPI has accepted the upload, so a declined
  # approval or a failed build leaves no tag naming a version PyPI does not
  # have. A run started by a pushed tag already has its tag.
  tag:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the released commit
        env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "this run was started by ${GITHUB_REF_NAME}; nothing to cut"
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  # After the tag, so no GitHub release appears for a version PyPI does not
  # have.
  publish-github:
    needs: [build, publish-pypi, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
