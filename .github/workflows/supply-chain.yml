name: Supply chain

# OpenSSF Scorecard answers questions about the *repository* — branch
# protection, release signing, token scopes, dependency pinning — not about the
# change in front of it. Those answers do not move between commits, and asking
# them takes over thirty minutes against this repository, so requiring it on
# every pull request would make each one wait half an hour for an answer that
# did not change.
#
# It stays in the declared floor (scanners/floor.py) at repository cadence. It
# runs here, on its own schedule, and publishes SARIF — which the audit ingests
# as coverage per D3, the same way any binary scanner that cannot be installed
# portably is meant to reach us.

on:
  schedule:
    # Weekly. Repository posture changes on the order of days, not commits.
    - cron: "27 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      # Required by scorecard-action to read branch protection and to publish
      # the result; both are read-only uses of the token.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishing to the public dashboard is a separate opt-in and is not
          # required for the SARIF this workflow exists to produce.
          publish_results: false

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('scorecard.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: scorecard.sarif
          category: openssf-scorecard

      # Retained so an audit run can ingest it with
      # `--sarif-import scorecard=scorecard.sarif`, which records the coverage
      # as `unverified` — an artifact we did not watch being produced.
      - name: Upload Scorecard SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          if-no-files-found: error
          path: scorecard.sarif
          retention-days: 30
