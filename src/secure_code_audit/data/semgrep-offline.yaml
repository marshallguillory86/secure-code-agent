# secure-code-agent offline ruleset — profile `sca-offline`
#
# Used when `scanners.semgrep.online` is false. Shipped inside the wheel.
#
# WHAT THIS IS. Cover for the languages the floor cannot see offline. Bandit is
# in the floor, is Apache-2.0, and is already offline — it needs no network and
# no registry — so Python is not the gap. Everything Bandit cannot read is:
# JavaScript, TypeScript, Go, Ruby and Java have no offline SAST in the floor
# at all, and that is what these rules are for.
#
# An earlier revision of this file carried nineteen Python rules. Seventeen of
# them duplicated Bandit, which is exactly what `CONTRIBUTING.md` has forbidden
# since the first commit — "shipping a parallel ruleset to Semgrep / Bandit /
# CodeQL" — and the "offline floor" argument used to justify them does not
# survive the observation that Bandit is itself offline. The two Python rules
# that remain are the two Bandit measurably misses.
#
# WHAT GOES IN. Language primitives — constructs the language itself provides,
# which do not change between releases and cost almost nothing to keep correct.
# And only where no floor scanner already covers them.
#
# WHAT STAYS OUT. Anything a floor scanner already finds, and anything
# framework-specific: Django ORM internals, Express middleware, Rails helpers,
# Spring annotations. Framework rules rot with every framework release, and
# framework breadth is what the online registry path is for. Both bounds are
# enforced by tests, not by review. See D9 and D11.
#
# EVERY RULE CARRIES a stable id, a version, a CWE, an OWASP bucket and a
# confidence — the mapping is the point, because registry rules deliver CWEs
# inconsistently.
#
# EVERY RULE IS PAIRED-TESTED: a fixture it must flag and a fixture it must
# not. Proving a rule fires is the easy half.
rules:
  # =========================================================================
  # Python — only what Bandit measurably misses. Everything else is Bandit's.
  # =========================================================================
  - id: sca.offline.python.debug-enabled
    message: >-
      Running a development server with debug=True exposes an interactive
      console and stack traces. Bandit's B201 only recognises Flask; this
      catches the pattern on any server object.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-489"
      owasp: "A05:2021-Security Misconfiguration"
      confidence: MEDIUM
      version: "1.0.0"
      covers-gap: "bandit B201 is Flask-specific and does not fire on a generic app.run(debug=True)"
    pattern: $APP.run(..., debug=True, ...)

  - id: sca.offline.python.ecb-mode-pycryptodome
    message: >-
      ECB mode leaks plaintext structure because identical blocks encrypt
      identically. Use an authenticated mode such as GCM. Bandit's B305 sees
      the `cryptography` spelling of this, not PyCryptodome's.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH
      version: "1.0.0"
      covers-gap: "bandit B305 flags cryptography's modes.ECB but not AES.MODE_ECB"
    pattern-either:
      - pattern: $AES.new($K, $AES.MODE_ECB, ...)
      - pattern: Crypto.Cipher.AES.new($K, Crypto.Cipher.AES.MODE_ECB, ...)

  # =========================================================================
  # JavaScript / TypeScript — no offline SAST in the floor reads these.
  # =========================================================================
  - id: sca.offline.javascript.child-process-exec
    message: >-
      child_process.exec() runs its argument through a shell. Use execFile()
      or spawn() with an argument array.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      confidence: HIGH
      version: "1.0.0"
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: cp.exec(...)

  - id: sca.offline.javascript.eval
    message: >-
      eval() executes its argument as code. If any part is attacker-influenced
      this is code injection.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
      version: "1.0.0"
    pattern: eval(...)

  - id: sca.offline.javascript.dynamic-code-construction
    message: >-
      new Function() and string-bodied setTimeout/setInterval compile their
      argument as code, with the same consequence as eval().
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: new Function(...)
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)

  - id: sca.offline.javascript.weak-hash
    message: >-
      MD5 and SHA-1 are broken for security use. Use SHA-256 or better.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: sca.offline.javascript.weak-random
    message: >-
      Math.random() is not cryptographically secure. Use crypto.randomBytes or
      crypto.getRandomValues for anything security-bearing.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-330"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: LOW
      version: "1.0.0"
    pattern: Math.random(...)

  - id: sca.offline.javascript.tls-verification-disabled
    message: >-
      Setting NODE_TLS_REJECT_UNAUTHORIZED to "0", or rejectUnauthorized to
      false, disables certificate validation.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-295"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH
      version: "1.0.0"
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: "{rejectUnauthorized: false}"

  - id: sca.offline.javascript.html-sink-assignment
    message: >-
      Assigning to innerHTML or outerHTML, or calling document.write, renders
      the value as markup. If it is attacker-influenced this is DOM XSS. Use
      textContent, or sanitize.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: $EL.innerHTML = $VALUE
      - pattern: $EL.outerHTML = $VALUE
      - pattern: document.write(...)
      - pattern: document.writeln(...)

  # =========================================================================
  # Go — gosec is not in the floor, so offline Go has no coverage at all.
  # =========================================================================
  - id: sca.offline.go.command-injection
    message: >-
      Invoking a shell with a constructed command string makes any
      attacker-influenced element command injection. Pass the program and its
      arguments to exec.Command separately.
    languages: [go]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: exec.Command("sh", "-c", ...)
      - pattern: exec.Command("bash", "-c", ...)
      - pattern: exec.CommandContext($CTX, "sh", "-c", ...)
      - pattern: exec.CommandContext($CTX, "bash", "-c", ...)

  - id: sca.offline.go.weak-hash
    message: >-
      MD5 and SHA-1 are broken for security use. Use SHA-256 or better.
    languages: [go]
    severity: WARNING
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)

  - id: sca.offline.go.weak-cipher
    message: >-
      DES and RC4 are obsolete for confidentiality. Use AES-GCM or
      ChaCha20-Poly1305.
    languages: [go]
    severity: ERROR
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH
      version: "1.0.0"
    pattern-either:
      - pattern: des.NewCipher(...)
      - pattern: des.NewTripleDESCipher(...)
      - pattern: rc4.NewCipher(...)

  - id: sca.offline.go.tls-verification-disabled
    message: >-
      InsecureSkipVerify disables certificate validation, so the connection is
      open to interception.
    languages: [go]
    severity: ERROR
    metadata:
      cwe: "CWE-295"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH
      version: "1.0.0"
    pattern: "InsecureSkipVerify: true"

  - id: sca.offline.go.weak-random
    message: >-
      math/rand is deterministic and predictable. Use crypto/rand for tokens,
      keys and nonces.
    languages: [go]
    severity: WARNING
    metadata:
      cwe: "CWE-330"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: LOW
      version: "1.0.0"
    pattern-either:
      - pattern: rand.Int()
      - pattern: rand.Intn(...)
      - pattern: rand.Float64()

  # =========================================================================
  # Ruby — Brakeman is not in the floor, so offline Ruby has no coverage.
  # =========================================================================
  - id: sca.offline.ruby.command-injection
    message: >-
      These forms pass their argument to a shell. Use the multi-argument form
      of system/exec, which does not.
    languages: [ruby]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: Kernel.system("...#{...}...")
      - pattern: system("...#{...}...")
      - pattern: exec("...#{...}...")
      - pattern: $X = `...`

  - id: sca.offline.ruby.code-injection
    message: >-
      eval and its relatives execute their argument as code. If any part is
      attacker-influenced this is code injection.
    languages: [ruby]
    severity: ERROR
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: eval(...)
      - pattern: instance_eval(...)
      - pattern: class_eval(...)

  - id: sca.offline.ruby.unsafe-deserialization
    message: >-
      Marshal.load and YAML.load construct arbitrary objects from their input.
      Use JSON, or YAML.safe_load.
    languages: [ruby]
    severity: ERROR
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021-Software and Data Integrity Failures"
      confidence: HIGH
      version: "1.0.0"
    pattern-either:
      - pattern: Marshal.load(...)
      - pattern: YAML.load(...)

  - id: sca.offline.ruby.weak-hash
    message: >-
      MD5 and SHA-1 are broken for security use. Use SHA-256 or better.
    languages: [ruby]
    severity: WARNING
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: Digest::MD5.$M(...)
      - pattern: Digest::SHA1.$M(...)

  # =========================================================================
  # Java — SpotBugs is not in the floor, so offline Java has no coverage.
  # =========================================================================
  - id: sca.offline.java.command-execution
    message: >-
      Runtime.exec() with a constructed string runs through the platform shell
      handling. Pass a String[] of program and arguments.
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
      version: "1.0.0"
    # Only Runtime.exec. ProcessBuilder with a String[] of program and
    # arguments is the *recommended fix*, and an earlier revision flagged it —
    # a rule that reports the remediation as the defect trains people to
    # ignore the rule.
    pattern: Runtime.getRuntime().exec($CMD)

  - id: sca.offline.java.unsafe-deserialization
    message: >-
      ObjectInputStream.readObject() instantiates whatever the stream names,
      which is remote code execution on untrusted input.
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021-Software and Data Integrity Failures"
      confidence: HIGH
      version: "1.0.0"
    pattern: $OIS.readObject()

  - id: sca.offline.java.weak-hash
    message: >-
      MD5 and SHA-1 are broken for security use. Use SHA-256 or better.
    languages: [java]
    severity: WARNING
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: MEDIUM
      version: "1.0.0"
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA1")
      - pattern: MessageDigest.getInstance("SHA-1")

  - id: sca.offline.java.weak-cipher
    message: >-
      DES and ECB mode are obsolete. Use AES in an authenticated mode such as
      GCM.
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH
      version: "1.0.0"
    # Matched on the algorithm string rather than by enumerating spellings:
    # "DES", "DES/CBC/PKCS5Padding" and "AES/ECB/PKCS5Padding" are the same
    # defect wearing three names.
    patterns:
      - pattern: Cipher.getInstance($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)"(des|desede|rc2|rc4|blowfish)[/"]|.*/ecb/

  - id: sca.offline.java.weak-random
    message: >-
      java.util.Random is a linear congruential generator and is predictable.
      Use SecureRandom for anything security-bearing.
    languages: [java]
    severity: WARNING
    metadata:
      cwe: "CWE-330"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: LOW
      version: "1.0.0"
    pattern: new Random(...)
