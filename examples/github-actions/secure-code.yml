# Drop this in .github/workflows/ of the repo you want to audit.
#
# Behavior: run the configured full audit and upload SARIF to Code Scanning.

name: secure-code

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents:        read
  security-events: write    # SARIF upload to Code Scanning

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0    # full history for git diff + Gitleaks history scan

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Run secure-code-agent
        id: audit
        # Pin to the full release commit SHA in production.
        uses: marshallguillory86/secure-code-agent@v0.10.0
        with:
          config:       secure-code-agent.json
          fail-on-gate: true
          fail-on-new:  ${{ github.event_name == 'pull_request' }}
