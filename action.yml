name: 'secure-code-agent'
description: 'Deterministic security gate + bounded AI remediation prompts. NIST SSDF / OWASP ASVS / CWE Top 25 anchored.'
author: 'Marshall Guillory'
branding:
  icon:  'shield'
  color: 'red'

inputs:
  config:
    description: >-
      Path to secure-code-agent config (JSON). An explicit value must exist or
      the run fails; leave empty to use secure-code-agent.json when present.
    required:    false
    default:     ''
  paths:
    description: 'One repository root to scan (default: current directory).'
    required:    false
    default:     '.'
  changed-only:
    description: 'Reserved for a future release. Non-empty values fail rather than silently scanning the wrong scope.'
    required:    false
    default:     ''
  fail-on-gate:
    description: >-
      Exit nonzero if any configured gate trips. Requires at least one gate in
      the config; the run fails loudly rather than passing with no security
      floor when none is configured.
    required:    false
    default:     'true'
  fail-on-new:
    description: 'Exit nonzero on findings not in baseline.'
    required:    false
    default:     'false'
  sarif-output:
    description: 'Path to write SARIF 2.1.0 output.'
    required:    false
    default:     'secure-code.sarif'
  upload-sarif:
    description: 'Upload SARIF to GitHub Code Scanning.'
    required:    false
    default:     'true'

outputs:
  sarif-path:
    description: 'Path to the emitted SARIF file, every result included.'
    value:       ${{ steps.run.outputs.sarif-path }}
  code-scanning-sarif-path:
    description: 'Path to the SARIF uploaded to code scanning: sarif-path without suppressed results, which code scanning would turn into alerts regardless.'
    value:       ${{ steps.run.outputs.code-scanning-sarif-path }}
  passed:
    description: 'Whether all gates passed.'
    value:       ${{ steps.run.outputs.passed }}

runs:
  using: 'composite'
  steps:
    - name: Install secure-code-agent
      shell: bash
      run: |
        python3 -m pip install "${GITHUB_ACTION_PATH}[required-scanners]"

    - name: Run audit
      id: run
      shell: bash
      env:
        SCA_CONFIG: ${{ inputs.config }}
        SCA_CHANGED_ONLY: ${{ inputs.changed-only }}
        SCA_FAIL_ON_GATE: ${{ inputs.fail-on-gate }}
        SCA_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        SCA_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        SCA_PATHS: ${{ inputs.paths }}
      run: |
        ARGS=()
        if [ -n "$SCA_CONFIG" ]; then
          ARGS+=(--config "$SCA_CONFIG")
        fi
        if [ -n "$SCA_CHANGED_ONLY" ]; then
          ARGS+=(--changed-only "$SCA_CHANGED_ONLY")
        fi
        if [ "$SCA_FAIL_ON_GATE" = "true" ]; then
          ARGS+=(--fail-on-gate)
        fi
        if [ "$SCA_FAIL_ON_NEW" = "true" ]; then
          ARGS+=(--fail-on-new)
        fi
        ARGS+=(--sarif-output "$SCA_SARIF_OUTPUT")
        ARGS+=(--code-scanning-sarif-output secure-code.code-scanning.sarif)
        ARGS+=(--output secure-code-report.md)
        ARGS+=(--json-output secure-code-report.json)
        ARGS+=(--prompt-output secure-code-remediation-prompt.md)
        ARGS+=(--comment-output secure-code-pr-comment.md)
        ARGS+=("$SCA_PATHS")

        set +e
        secure-code-agent "${ARGS[@]}"
        EC=$?
        set -e

        echo "sarif-path=$SCA_SARIF_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "code-scanning-sarif-path=secure-code.code-scanning.sarif" >> "$GITHUB_OUTPUT"
        if [ "$EC" -eq 0 ]; then
          echo "passed=true"  >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit "$EC"
        fi

    # The code-scanning file, not the record: code scanning opens an alert for
    # every uploaded result and does not act on SARIF `suppressions`, so the
    # record would raise one for each test-tree and documentation finding and
    # each reviewed .scignore.yaml entry (D22).
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles('secure-code.code-scanning.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        sarif_file: secure-code.code-scanning.sarif
        category:   secure-code-agent

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: secure-code-agent-report
        path: |
          secure-code-report.md
          secure-code-report.json
          secure-code-pr-comment.md
          secure-code-remediation-prompt.md
          ${{ inputs.sarif-output }}
          secure-code.code-scanning.sarif
        if-no-files-found: ignore
